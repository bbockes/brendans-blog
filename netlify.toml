[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache HTML files (for SPA routing)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# How WordPress clients discover the REST API from just a site URL.
[[headers]]
  for = "/"
  [headers.values]
    Link = '<https://blog.brendanbockes.com/wp-json/>; rel="https://api.w.org/"'

[[headers]]
  for = "/feed.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# WordPress-compatible publishing bridge, so Ulysses can publish into Sanity.
# These must precede the SPA fallback below.
[[redirects]]
  from = "/wp-json"
  to = "/.netlify/functions/wordpress-bridge"
  status = 200
  force = true

[[redirects]]
  from = "/wp-json/*"
  to = "/.netlify/functions/wordpress-bridge"
  status = 200
  force = true

[[redirects]]
  from = "/wp-admin/authorize-application.php"
  to = "/.netlify/functions/wordpress-bridge"
  status = 200
  force = true

[[redirects]]
  from = "/posts/*/"
  to = "/posts/:splat"
  status = 301

# Dynamic RSS feed - routes to Netlify function for real-time updates
[[redirects]]
  from = "/feed.xml"
  to = "/.netlify/functions/rss-feed"
  status = 200

# SPA fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

